function spellbookOrbitSunsOutsideRing() {
  const allIds = nodesDS.getIds();
  if (!allIds || !allIds.length) return;
  const pos = network.getPositions(allIds);
  const pts = allIds.map((id) => pos[id]).filter((p) => p && Number.isFinite(p.x) && Number.isFinite(p.y));
  if (!pts.length) return;

  const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
  const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
  const maxR = Math.max(1, pts.reduce((m, p) => {
    const dx = p.x - cx;
    const dy = p.y - cy;
    return Math.max(m, Math.hypot(dx, dy));
  }, 0));
  const outerR = maxR * 1.26;

  const suns = nodesDS.get().slice()
    .sort((a, b) => Number(b._degree || 0) - Number(a._degree || 0))
    .slice(0, 8);

  suns.forEach((n, i) => {
    const p = pos[n.id];
    let ang = (Math.PI * 2 * i) / Math.max(1, suns.length);
    if (p && Number.isFinite(p.x) && Number.isFinite(p.y)) {
      const dx = p.x - cx;
      const dy = p.y - cy;
      if (Math.hypot(dx, dy) > 1e-3) ang = Math.atan2(dy, dx);
    }
    network.moveNode(n.id, cx + Math.cos(ang) * outerR, cy + Math.sin(ang) * outerR);
  });
  network.redraw();
}

window.addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'link-mode-set') {
    __spellbookLinkModeForced = !!d.enabled;
    const lm = document.getElementById('spell-link-mode');
    if (lm) lm.checked = !!d.enabled;
    spellLinkDraft = null;
    spellbookSetLinkStatus(__spellbookLinkModeForced ? 'Pick first node…' : 'Off');
    return;
  }
  if (d.type === 'link-mode-cancel') {
    spellLinkDraft = null;
    spellbookSetLinkStatus(spellbookLinkModeOn() ? 'Pick first node…' : 'Off');
    return;
  }
  if (d.type === 'link-mode-clear') {
    spellbookSaveCustomLinks([]);
    edgesDS.getIds().filter(function (id) { return String(id).indexOf('sb_l_') === 0; })
      .forEach(function (id) { try { edgesDS.remove(id); } catch (e) {} });
    spellLinkDraft = null;
    spellbookSetLinkStatus(spellbookLinkModeOn() ? 'Pick first node…' : 'Off');
    return;
  }
  if (d.type === 'spell-export-links' && window.parent !== window) {
    try { window.parent.postMessage({ type: 'spell-export-links-data', rows: spellbookExportLinksRich() }, '*'); } catch (e) {}
    return;
  }
  if (d.type === 'request-groups') {
    try {
      const items = LEGEND.map(function (c) {
        return { cid: c.cid, label: c.label, color: c.color, count: c.count };
      });
      window.parent.postMessage({ type: 'dock-groups-data', kind: 'spell', items: items }, '*');
    } catch (e) {}
    return;
  }
  if (d.type === 'spell-community-focus' && d.cid != null) {
    const cid = Number(d.cid);
    const updates = RAW_NODES.map(function (n) {
      return { id: n.id, hidden: n.community !== cid };
    });
    nodesDS.update(updates);
    return;
  }
});

(function spellbookEmitBootStats() {
  if (window.parent === window) return;

      edges: RAW_EDGES.length,
      communities: LEGEND.length,

    }, '*');

})();

function drawHyperedges() {
    const canvas = network.canvas.frame.canvas;
    const ctx = canvas.getContext('2d');
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        // Draw convex hull as filled polygon
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const scale = network.getScale();
        const offset = network.getViewPosition();
        const toCanvas = (p) => ({
            x: (p.x - offset.x) * scale + canvas.width / 2,
            y: (p.y - offset.y) * scale + canvas.height / 2
        });
        const pts = positions.map(toCanvas);
        // Expand hull slightly
        const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
        const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
        const expanded = pts.map(p => ({
            x: cx + (p.x - cx) * 1.15,
            y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
    });
}
// Draw hulls under nodes/edges (afterDrawing sits on top and feels "closer to the glass")
network.on('beforeDrawing', drawHyperedges);
